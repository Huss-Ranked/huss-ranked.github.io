		<script type="module">
// ---------------------------------------------------------------------------
// Hussle: Trystero (P2P rooms) and leo-profanity, both from esm.sh.
//
// main.gd talks to this through:
//   window.trysteroSelfId            this player's network id
//   window.joinTrysteroRoom(code)    join a room (main.gd leaves the old one first)
//   window.trysteroRoom.leave()      leave it
//   window.sendTrysteroPacket(json)  send a packet (a JSON string) to everyone in the room
// and this calls back into the game with
//   window._godot_on_peer_joined(id), window._godot_on_peer_left(id),
//   window._godot_on_data_received(json, id)
// main.gd also checks names with window.leoProfanity (it has a built-in copy
// of the same word list in case this doesn't load).
// ---------------------------------------------------------------------------

// Pinned versions, so every player runs the same code. The second address is a
// backup CDN, used only if esm.sh can't be reached.
const TRYSTERO_URLS = ['https://esm.sh/trystero@0.26.0/nostr', 'https://cdn.jsdelivr.net/npm/trystero@0.26.0/dist/nostr.mjs/+esm'];
const LEO_PROFANITY_URLS = ['https://esm.sh/leo-profanity@1.9.0', 'https://cdn.jsdelivr.net/npm/leo-profanity@1.9.0/+esm'];

// Players only find each other inside the same app ID.
const APP_ID = 'hussle-ranked';
// How many relay servers to use. Only relays on port 443 (the normal HTTPS port,
// which networks rarely block) are picked; more of them = more chances that at
// least one gets through a strict network.
const RELAY_COUNT = 8;

async function importFirst(urls) {
	let lastError = null;
	for (const url of urls) {
		try {
			return await import(url);
		} catch (err) {
			lastError = err;
			console.warn('[Hussle] Could not load ' + url, err);
		}
	}
	throw lastError;
}

// Keep only wss:// relays on port 443, then pick RELAY_COUNT of them. The pick
// depends only on APP_ID, so every player ends up on the same relays.
function pickRelays(all) {
	const on443 = all.filter((url) => {
		try {
			const u = new URL(url);
			return u.protocol === 'wss:' && (u.port === '' || u.port === '443');
		} catch (err) {
			return false;
		}
	}).sort();
	let seed = 0;
	for (const ch of APP_ID) {
		seed = (Math.imul(seed, 31) + ch.charCodeAt(0)) >>> 0;
	}
	const random = () => {
		seed = (seed + 0x6D2B79F5) >>> 0;
		let t = seed;
		t = Math.imul(t ^ (t >>> 15), t | 1);
		t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	};
	for (let i = on443.length - 1; i > 0; i--) {
		const j = Math.floor(random() * (i + 1));
		[on443[i], on443[j]] = [on443[j], on443[i]];
	}
	return on443.slice(0, RELAY_COUNT);
}

importFirst(LEO_PROFANITY_URLS).then((mod) => {
	const leo = mod.default || mod;
	if (leo && typeof leo.check === 'function') {
		window.leoProfanity = leo;
		console.log('[Hussle] leo-profanity ready (' + leo.list().length + ' words).');
	}
}).catch(() => {
	console.warn('[Hussle] leo-profanity did not load - the game uses its built-in copy of the word list.');
});

importFirst(TRYSTERO_URLS).then(({ joinRoom, selfId, defaultRelayUrls }) => {
	if (typeof window.trysteroSelfId === 'string' && window.trysteroSelfId !== selfId) {
		// The game already started without the relay servers (it gave itself
		// its own id for join codes), so the two can't be mixed now.
		console.warn('[Trystero] Loaded too late - refresh the page to use the relay servers.');
		return;
	}
	const relays = pickRelays(defaultRelayUrls || []);
	console.log('[Trystero] Using ' + relays.length + ' relay servers on port 443: ' + relays.join(', '));
	window.trysteroSelfId = selfId;

	window.joinTrysteroRoom = function (code) {
		console.log('[Trystero] Local Peer ID: ' + selfId + ' Joining room: ' + code);
		const room = joinRoom({ appId: APP_ID, relayConfig: { urls: relays } }, code);
		const action = room.makeAction('data');
		window.trysteroRoom = room;
		// Events from a room the game has left are ignored.
		const current = () => window.trysteroRoom === room;
		window.sendTrysteroPacket = function (json) {
			if (current()) {
				action.send(json).catch((err) => console.warn('[Trystero] Send failed:', err));
			}
		};
		action.onMessage = (data, context) => {
			if (current() && window._godot_on_data_received) {
				window._godot_on_data_received(data, context.peerId);
			}
		};
		room.onPeerJoin = (peerId) => {
			if (current() && window._godot_on_peer_joined) {
				window._godot_on_peer_joined(peerId);
			}
		};
		room.onPeerLeave = (peerId) => {
			if (current() && window._godot_on_peer_left) {
				window._godot_on_peer_left(peerId);
			}
		};
	};
}).catch(() => {
	console.error('[Trystero] Could not load Trystero from esm.sh - the relay servers are off. Join codes still work.');
});
		</script>

<link rel="manifest" href="hussranked.manifest.json">
<!-- Load Trystero Nostr via ES Module -->
<script type="module">
    import { joinRoom, selfId } from 'https://esm.sh/trystero@0.18.0/nostr';

    window.trysteroSelfId = selfId;

    window.joinTrysteroRoom = function(roomCode) {
        console.log("[Trystero] Local Peer ID:", selfId, "Joining room:", roomCode);
        
        const config = { 
            appId: 'huss_ranked_1v1_game',
            relayConfig: {
                urls: [
                    'wss://relay.damus.io',
                    'wss://nos.lol',
                    'wss://relay.snort.social'
                ]
            },
            rtcConfig: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun.cloudflare.com:3478' }
                ]
            }
        };

        try {
            window.trysteroRoom = joinRoom(config, roomCode);

            const [sendData, getData] = window.trysteroRoom.makeAction('gameData');
            window.trysteroSendAction = sendData;

            getData((data, peerId) => {
                if (window._godot_on_data_received) {
                    window._godot_on_data_received(JSON.stringify(data), peerId);
                }
            });

            window.trysteroRoom.onPeerJoin(peerId => {
                const connectedPeers = window.trysteroRoom.getPeers();
                // Enforce strict 1v1 limit: reject 3rd+ connections
                if (Object.keys(connectedPeers).length > 1) {
                    console.warn("[Trystero] Lobby full! Rejecting extra peer:", peerId);
                    return;
                }
                
                console.log("[Trystero] Opponent peer joined:", peerId);
                if (window._godot_on_peer_joined) {
                    window._godot_on_peer_joined(peerId);
                }
            });

            window.trysteroRoom.onPeerLeave(peerId => {
                console.log("[Trystero] Peer disconnected:", peerId);
                if (window._godot_on_peer_left) {
                    window._godot_on_peer_left(peerId);
                }
            });
        } catch (err) {
            console.error("[Trystero] Room initialization error:", err);
        }
    };

    window.sendTrysteroPacket = function(jsonStr) {
        if (window.trysteroSendAction) {
            window.trysteroSendAction(JSON.parse(jsonStr));
        }
    };
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"hussranked","experimentalVK":false,"fileSizes":{"hussranked.pck":8949488,"hussranked.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"hussranked.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
