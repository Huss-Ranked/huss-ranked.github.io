[runnable_presets]

Web="Web"

[preset.0]

name="Web"
platform="Web"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../Huss Ranked Game/Huss ranked V2.html"
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<!DOCTYPE html>
<html lang=\"en\">
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>3D Ranked 1v1</title>

    <!-- Load Trystero Torrent Bundle -->
    <script src=\"https://cdn.jsdelivr.net/npm/trystero@0.18.0/dist/trystero-torrent.min.js\"></script>

    <script>
        window.trysteroRoom = null;
        window.trysteroSendAction = null;

        window.joinTrysteroRoom = function(roomCode) {
            // Provide explicit, high-availability WebTorrent signaling trackers
            const config = { 
                appId: 'huss_ranked_1v1_game',
                trackerUrls: [
                    'wss://tracker.openwebtorrent.com',
                    'wss://tracker.files.fm:7073/announce',
                    'wss://tracker.btorrent.xyz'
                ]
            };

            window.trysteroRoom = trystero.joinRoom(config, roomCode);

            const [sendData, getData] = window.trysteroRoom.makeAction('gameData');
            window.trysteroSendAction = sendData;

            getData((data, peerId) => {
                if (window._godot_on_data_received) {
                    window._godot_on_data_received(JSON.stringify(data));
                }
            });

            window.trysteroRoom.onPeerJoin(peerId => {
                console.log(\"[Trystero JS] Peer Joined:\", peerId);
                if (window._godot_on_peer_joined) {
                    window._godot_on_peer_joined(peerId);
                }
            });

            window.trysteroRoom.onPeerLeave(peerId => {
                console.log(\"[Trystero JS] Peer Left:\", peerId);
                if (window._godot_on_peer_left) {
                    window._godot_on_peer_left(peerId);
                }
            });
        };

        window.sendTrysteroPacket = function(jsonStr) {
            if (window.trysteroSendAction) {
                const data = JSON.parse(jsonStr);
                window.trysteroSendAction(data);
            }
        };
    </script>
</head>
<body style=\"margin:0; overflow:hidden; background-color:#111;\">
    <canvas id=\"canvas\"></canvas>
</body>
</html>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4
